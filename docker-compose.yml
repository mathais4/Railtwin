services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: railtwin
      POSTGRES_PASSWORD: railtwin
      POSTGRES_DB: railtwin
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U railtwin"]
      interval: 2s
      retries: 20
    volumes: ["pgdata:/var/lib/postgresql/data"]
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://railtwin:railtwin@db:5432/railtwin
      PORT: 3000
    ports: ["3000:3000"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
